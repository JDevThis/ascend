name: iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project from project.yml
        run: xcodegen generate

      - name: List available iPhone simulators
        run: xcrun simctl list devices available iPhone

      - name: Build (generic iOS Simulator, no signing)
        run: |
          xcodebuild build \
            -project Ascend.xcodeproj \
            -scheme Ascend \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Test (booted iPhone 16 simulator, no signing)
        run: |
          xcodebuild test \
            -project Ascend.xcodeproj \
            -scheme Ascend \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
